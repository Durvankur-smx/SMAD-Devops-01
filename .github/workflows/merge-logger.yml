name: PR Merge Logger

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  log-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get PR details
        id: pr
        run: |
          echo "TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "MERGED_BY=${{ github.event.pull_request.merged_by.login }}" >> $GITHUB_OUTPUT
          echo "SOURCE=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          echo "TARGET=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
          echo "DATE=$(date)" >> $GITHUB_OUTPUT

      - name: Fetch commits of PR
        run: |
          curl -s \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits \
          | jq -r '.[].commit.message' > commits.txt

      - name: Append to log file
        run: |
          LOG="merge-log.md"

          echo "## Merge on ${{ steps.pr.outputs.DATE }}" >> $LOG
            echo "" >> $LOG
          echo "**PR Title:** ${{ steps.pr.outputs.TITLE }}" >> $LOG
            echo "" >> $LOG
          echo "**PR Author:** @${{ steps.pr.outputs.AUTHOR }}" >> $LOG
            echo "" >> $LOG
          echo "**Merged By:** @${{ steps.pr.outputs.MERGED_BY }}" >> $LOG
          echo "" >> $LOG
          echo "**From Branch:** ${{ steps.pr.outputs.SOURCE }}" >> $LOG
          echo "" >> $LOG
          echo "**Into Branch:** ${{ steps.pr.outputs.TARGET }}" >> $LOG
          echo "" >> $LOG
          echo "**Commits:**" >> $LOG

          while read line; do
            echo "- $line" >> $LOG
          done < commits.txt

          echo "" >> $LOG
          echo "---" >> $LOG
          echo "" >> $LOG

      - name: Commit log file
        run: |
          git config user.name "Shrinivas2708"
          git config user.email "ssherikar2005@gmail.com"
          git add merge-log.md
          git commit -m "Update merge log for PR #${{ github.event.pull_request.number }}" || echo "No changes"
          git push